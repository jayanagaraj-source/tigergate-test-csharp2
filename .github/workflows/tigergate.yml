# TigerGate security scan. Runs the TigerGate CLI container against this
# repository and uploads results.
#
# Toolchains are provisioned automatically: the "Provision toolchains" step
# detects the manifests present (pom.xml, *.csproj, package.json, go.mod, ...)
# and installs only the matching runtime, so SCA resolves the full transitive
# graph instead of degrading to static manifest parsing. Nothing is installed
# for an ecosystem that is absent, or if the CLI image already ships the tool.
#
# Project dependencies themselves are NEVER installed: this repo's Python pins
# are deliberately unbuildable (see SECURITY_FIXTURES.md), and TigerGate reads
# requirements*.txt / pyproject.toml statically.
name: TigerGate Security Scan

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      cli_image:
        description: "TigerGate CLI image (without tag)"
        type: string
        required: true
        default: tigergate/tigergate-cli
      cli_tag:
        description: "TigerGate CLI image tag"
        type: string
        required: true
        default: latest
      scan_type:
        description: "Scan type to run"
        type: choice
        required: true
        default: all
        options:
          - all
          - sast
          - sca
          - secrets
          - iac
      quality_gate:
        description: "Enforce the quality gate (fails the job when the gate fails)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  statuses: write
  pull-requests: write

concurrency:
  group: tigergate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: TigerGate ${{ inputs.scan_type || 'all' }} scan
    # Fork PRs cannot read secrets, so TIGERGATE_API_KEY would be empty.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The whole job runs inside the selected TigerGate CLI image.
    container:
      image: ${{ inputs.cli_image || 'tigergate/tigergate-cli' }}:${{ inputs.cli_tag || 'latest' }}

    env:
      TIGERGATE_API_KEY: ${{ secrets.TIGERGATE_API_KEY }}
      TIGERGATE_API_URL: https://api.staging.tigergate.dev
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # PR runs use the defaults; workflow_dispatch overrides them.
      SCAN_TYPE: ${{ inputs.scan_type || 'all' }}
      # Report-only by default: this repo holds 241 intentional findings, so an
      # enforced gate would fail every PR until they are baselined.
      QUALITY_GATE: ${{ inputs.quality_gate || false }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history: the scanner reads git metadata and --scan-scope full
          # needs more than a shallow clone.
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git safe.directory
        # The container runs as root while the runner user owns the workspace,
        # so git refuses to operate on it ("dubious ownership") until trusted.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory '*'
          git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD

      - name: Check configuration
        run: |
          if [ -z "${TIGERGATE_API_KEY:-}" ]; then
            echo "::error title=TigerGate not configured::Set the TIGERGATE_API_KEY repository secret."
            exit 1
          fi
          tigergate --version

      # Installs a toolchain only when the repository actually needs it and the
      # image does not already provide it. Relevant to dependency resolution, so
      # it is skipped for scan types that do not do SCA.
      #
      #   pom.xml / build.gradle  -> JDK + Maven   (Gradle uses ./gradlew)
      #   *.csproj / global.json  -> .NET SDK      (honours global.json pin)
      #   package.json            -> Node + npm
      #   go.mod                  -> Go
      #   Gemfile                 -> Ruby + Bundler
      #   composer.json           -> PHP + Composer
      #   Cargo.toml              -> Rust + Cargo
      #   requirements*.txt       -> Python (interpreter only, no pip install)
      #
      # A non-Debian image or a failed install downgrades SCA to static manifest
      # parsing; it warns rather than failing the scan.
      - name: Provision toolchains
        if: contains(fromJSON('["all","sca"]'), env.SCAN_TYPE)
        run: |
          set -u
          NEEDED=""
          have() { command -v "$1" >/dev/null 2>&1; }
          found() { [ -n "$(find . -path ./.git -prune -o -name "$1" -print -quit)" ]; }
          need() { NEEDED="$NEEDED $1"; }

          if have apt-get; then
            APT=1
          else
            APT=0
            echo "::warning::No apt-get in this image - a missing toolchain will downgrade SCA to static manifest parsing."
          fi

          # ---------- Java (Maven / Gradle) ----------
          # JDK version comes from .java-version, else 21 (which compiles
          # source/target 17 fine). Gradle builds use the committed ./gradlew.
          if found 'pom.xml' || found 'build.gradle' || found 'build.gradle.kts'; then
            JDK=21
            [ -f .java-version ] && JDK="$(tr -dc '0-9' < .java-version | head -c2)"
            case "$JDK" in 8|11|17|21|25) ;; *) JDK=21 ;; esac
            have java || need "openjdk-${JDK}-jdk-headless"
            if found 'pom.xml'; then
              have mvn || need "maven"
            fi
            have java && have mvn && echo "Java toolchain already present."
          fi

          # ---------- .NET ----------
          if found '*.csproj' || found '*.fsproj' || found '*.vbproj' || found 'global.json'; then
            if have dotnet; then
              echo ".NET SDK already present."
            elif have curl; then
              # Official installer; --jsonfile honours the SDK pinned in global.json.
              curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
              chmod +x /tmp/dotnet-install.sh
              if [ -f global.json ]; then
                /tmp/dotnet-install.sh --jsonfile global.json --install-dir /usr/share/dotnet
              else
                /tmp/dotnet-install.sh --channel LTS --install-dir /usr/share/dotnet
              fi
              ln -sf /usr/share/dotnet/dotnet /usr/local/bin/dotnet
              echo "DOTNET_ROOT=/usr/share/dotnet" >> "$GITHUB_ENV"
            else
              echo "::warning::.NET project detected but neither dotnet nor curl is available."
            fi
          fi

          # ---------- Node ----------
          if found 'package.json'; then
            if have node && have npm; then echo "Node already present."; else need "nodejs npm"; fi
          fi

          # ---------- Go ----------
          if found 'go.mod'; then
            if have go; then echo "Go already present."; else need "golang-go"; fi
          fi

          # ---------- Ruby ----------
          if found 'Gemfile'; then
            if have ruby && have bundle; then echo "Ruby already present."; else need "ruby-full"; fi
          fi

          # ---------- PHP ----------
          if found 'composer.json'; then
            if have php && have composer; then echo "PHP already present."; else need "php-cli composer"; fi
          fi

          # ---------- Rust ----------
          if found 'Cargo.toml'; then
            if have cargo; then echo "Rust already present."; else need "cargo"; fi
          fi

          # ---------- Python (interpreter only) ----------
          if found 'requirements*.txt' || found 'pyproject.toml' || found 'Pipfile'; then
            if have python3; then echo "Python already present."; else need "python3"; fi
          fi

          if [ -z "${NEEDED# }" ]; then
            echo "No additional toolchain required."
            exit 0
          fi

          echo "Installing:$NEEDED"
          if [ "$APT" -eq 1 ]; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            # shellcheck disable=SC2086
            apt-get install -y -qq --no-install-recommends $NEEDED \
              || echo "::warning::Toolchain install failed - SCA may under-report transitive dependencies."
          fi

          # Maven and the CLI both prefer JAVA_HOME when it is set.
          if have java; then
            JAVA_HOME_DIR=$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")
            echo "JAVA_HOME=$JAVA_HOME_DIR" >> "$GITHUB_ENV"
            echo "$JAVA_HOME_DIR/bin" >> "$GITHUB_PATH"
          fi

          for t in java mvn dotnet node go ruby php cargo python3; do
            have "$t" && echo "  $t -> $(command -v "$t")"
          done || true

      - name: Run TigerGate scan
        id: scan
        run: |
          set -o pipefail
          tigergate scan \
            --type "$SCAN_TYPE" \
            --scan-scope full \
            --upload \
            --quality-gate="$QUALITY_GATE" \
            2>&1 | tee /tmp/tigergate-scan.log

      - name: Scan result
        if: always()
        env:
          CLI_IMAGE: ${{ inputs.cli_image || 'tigergate/tigergate-cli' }}:${{ inputs.cli_tag || 'latest' }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
          SCAN_ID: ${{ steps.scan.outputs.scan_id }}
          GATE_STATUS: ${{ steps.scan.outputs.gate_status }}
        run: |
          LOG=/tmp/tigergate-scan.log
          {
            echo "## TigerGate scan result"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| CLI image | \`$CLI_IMAGE\` |"
            echo "| Scan type | \`$SCAN_TYPE\` |"
            echo "| Quality gate enforced | \`$QUALITY_GATE\` |"
            echo "| Scan outcome | \`$SCAN_OUTCOME\` |"
            echo "| Scan ID | ${SCAN_ID:-see log} |"
            echo "| Gate status | ${GATE_STATUS:-see log} |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          echo
          echo "----- raw CLI output (last 100 lines) -----"
          if [ -f "$LOG" ]; then tail -100 "$LOG"; else echo "no scan log produced"; fi

  fork-notice:
    name: Fork PR (scan skipped)
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain why the scan did not run
        run: |
          echo "::notice title=TigerGate skipped::Fork pull requests cannot read repository secrets, so TIGERGATE_API_KEY is unavailable."
          {
            echo "### TigerGate scan skipped"
            echo
            echo "This pull request comes from a fork. GitHub does not expose repository"
            echo "secrets to \`pull_request\` runs from forks, so the scan cannot authenticate."
            echo
            echo "Fork changes are covered after merge, or by a maintainer running this"
            echo "workflow manually via workflow_dispatch."
          } >> "$GITHUB_STEP_SUMMARY"
